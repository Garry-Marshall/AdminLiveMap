<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rust Live Map</title>
<style>
  :root {
    --bg: #14171a; --panel: #1c2024; --panel2: #23282d; --line: #31373d;
    --text: #e6e3dc; --muted: #8d949b; --accent: #d9a441; --bad: #e0634f; --good: #6cbf6a; --warn: #e3b341;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.4 "Segoe UI", system-ui, sans-serif; }
  #app { display: grid; grid-template-columns: 1fr 320px; height: 100vh; }
  #mapWrap { position: relative; overflow: hidden; cursor: grab; background: #1b3a4b; }
  #mapWrap.dragging { cursor: grabbing; }
  canvas { display: block; width: 100%; height: 100%; }
  #side { background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  header { padding: 12px 16px 10px; border-bottom: 1px solid var(--line); }
  .titleRow { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: .02em; }
  .status { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; margin-top: 4px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.ok { background: var(--good); } .dot.bad { background: var(--bad); } .dot.wait { background: var(--accent); }
  #health { display: none; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-top: 10px; }
  #health.on { display: grid; }
  .stat { background: var(--panel2); border-radius: 6px; padding: 5px 6px; text-align: center; }
  .stat b { display: block; font-size: 14px; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 11px; color: var(--muted); }
  .stat.warn b { color: var(--warn); } .stat.bad b { color: var(--bad); }
  section { padding: 10px 16px; border-bottom: 1px solid var(--line); }
  label { display: block; font-size: 12px; color: var(--muted); margin: 6px 0 3px; }
  input[type=text], input[type=password], input[type=number], select {
    width: 100%; padding: 7px 9px; background: var(--panel2); color: var(--text);
    border: 1px solid var(--line); border-radius: 6px; font: inherit; }
  select { padding: 2px 4px; width: auto; font-size: 12px; }
  .row { display: flex; gap: 8px; } .row > div { flex: 1; } .row > div.port { flex: 0 0 90px; }
  .check { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--text); margin: 4px 0 0; cursor: pointer; }
  button { background: var(--accent); color: #1a1a1a; border: 0; border-radius: 6px; padding: 8px 12px;
    font: inherit; font-weight: 600; cursor: pointer; }
  button.ghost { background: var(--panel2); color: var(--text); border: 1px solid var(--line); font-weight: 500; }
  button.small { padding: 3px 9px; font-size: 12px; }
  button:hover { filter: brightness(1.1); }
  #connectBtn { width: 100%; margin-top: 10px; }
  #discBtn { display: none; }
  .toggles { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
  .tabs { display: flex; border-bottom: 1px solid var(--line); }
  .tab { flex: 1; text-align: center; padding: 8px 4px; cursor: pointer; color: var(--muted); font-weight: 600; font-size: 13px;
    border-bottom: 2px solid transparent; user-select: none; }
  .tab.on { color: var(--text); border-bottom-color: var(--accent); }
  .badge { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 4px; border-radius: 9px; background: var(--bad);
    color: #fff; font-size: 11px; line-height: 18px; }
  .badge:empty { display: none; }
  .pane { flex: 1; overflow-y: auto; padding: 6px 8px; display: none; min-height: 0; }
  .pane.on { display: block; }
  .p { display: grid; grid-template-columns: 14px 1fr auto; gap: 2px 8px; align-items: center;
    padding: 7px 8px; border-radius: 6px; cursor: pointer; }
  .p:hover { background: var(--panel2); }
  .p.sel { background: #2c3238; outline: 1px solid var(--accent); }
  .p .sw { width: 12px; height: 12px; border-radius: 50%; }
  .p .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .p .gr { font-variant-numeric: tabular-nums; color: var(--accent); font-weight: 600; }
  .p .sub { grid-column: 2 / 4; color: var(--muted); font-size: 12px; }
  .empty { color: var(--muted); padding: 10px 8px; }
  .chatLine, .ev { padding: 4px 6px; border-radius: 5px; font-size: 13px; word-wrap: break-word; }
  .chatLine .t, .ev .t { color: var(--muted); font-size: 11px; margin-right: 6px; font-variant-numeric: tabular-nums; }
  .chatLine .who { font-weight: 600; margin-right: 4px; }
  .chatLine .ch { color: var(--good); font-size: 11px; margin-right: 4px; }
  .chatLine.server .who { color: var(--accent); }
  .ev { cursor: default; }
  .ev.click { cursor: pointer; } .ev.click:hover { background: var(--panel2); }
  .ev .ic { display: inline-block; width: 16px; text-align: center; margin-right: 4px; }
  .ev.join .ic { color: var(--good); } .ev.leave .ic { color: var(--muted); } .ev.death .ic { color: var(--bad); } .ev.game .ic { color: var(--accent); }
  #chatForm { display: none; gap: 6px; padding: 8px; border-top: 1px solid var(--line); }
  #chatForm.on { display: flex; }
  #chatForm input { flex: 1; }
  footer { padding: 7px 16px; color: var(--muted); font-size: 12px; border-top: 1px solid var(--line); }
  #zoomBtns { position: absolute; right: 12px; top: 12px; display: flex; flex-direction: column; gap: 6px; }
  #zoomBtns button { width: 34px; height: 34px; padding: 0; font-size: 18px; }
  #msg { position: absolute; left: 50%; top: 45%; transform: translate(-50%,-50%); background: rgba(20,23,26,.88);
    padding: 16px 22px; border-radius: 10px; color: var(--text); max-width: 420px; text-align: center; }
  #msg:empty { display: none; }
  #hover { position: absolute; pointer-events: none; background: rgba(20,23,26,.93); padding: 5px 8px;
    border-radius: 5px; font-size: 12px; color: var(--text); display: none; max-width: 320px; }
  #hover .g { color: var(--accent); font-weight: 600; }
  #hover div + div { margin-top: 3px; padding-top: 3px; border-top: 1px solid var(--line); }
  #toasts { position: absolute; left: 12px; top: 12px; display: flex; flex-direction: column; gap: 6px; pointer-events: none; max-width: 360px; }
  .toast { background: rgba(20,23,26,.92); border-left: 3px solid var(--accent); padding: 7px 11px; border-radius: 5px;
    font-size: 13px; transition: opacity .5s; }
  .toast.join { border-color: var(--good); } .toast.leave { border-color: var(--muted); }
  .toast.death { border-color: var(--bad); } .toast.chat { border-color: #4fc3f7; } .toast.game { border-color: var(--accent); }
  #search { position: sticky; top: 0; z-index: 1; margin-bottom: 4px; }
  #listNote, #busyNote { color: var(--muted); font-size: 12px; padding: 2px 4px; }
  #listNote:empty, #busyNote:empty { display: none; }
  #busyNote { padding: 6px 0 0; }
  .heatRow { display: flex; align-items: center; gap: 6px; margin-top: 4px; flex-wrap: wrap; }
  .heatRow .check { margin: 0; }
  #heatKey { position: absolute; left: 12px; bottom: 12px; background: rgba(20,23,26,.9); padding: 7px 10px; border-radius: 6px;
    font-size: 12px; color: var(--text); pointer-events: none; display: none; min-width: 210px; }
  #heatKey.on { display: block; }
  #heatKey .bar { height: 9px; border-radius: 3px; margin: 5px 0 2px;
    background: linear-gradient(to right, rgba(40,60,255,.35), #2aa8ff, #33d17a, #ffd23f, #ff5a36); }
  #heatKey .ends { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; }
  /* player card: bottom right of the map while a player is selected */
  #card { position: absolute; right: 12px; bottom: 12px; width: 300px; max-height: calc(100% - 150px); overflow-y: auto;
    background: rgba(20,23,26,.95); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-size: 13px;
    display: none; cursor: default; }
  #card.on { display: block; }
  #card .hd { display: flex; align-items: center; gap: 8px; }
  #card .sw { width: 12px; height: 12px; border-radius: 50%; flex: none; display: inline-block; }
  #card .nm { font-weight: 600; font-size: 15px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #card .close { background: none; border: 0; color: var(--muted); font-size: 18px; padding: 0 2px; line-height: 1; }
  #card .close:hover { color: var(--text); }
  #card .meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
  #card .meta b { color: var(--text); font-weight: 600; }
  #card .sid { display: flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  #card .btns { display: flex; gap: 6px; margin-top: 8px; }
  #card h4 { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 10px 0 3px; font-weight: 600; }
  #card .it { display: flex; align-items: center; gap: 6px; padding: 3px 6px; border-radius: 5px; cursor: pointer; }
  #card .it:hover { background: var(--panel2); }
  #card .it .tx { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #card .it .gr { color: var(--accent); font-weight: 600; font-variant-numeric: tabular-nums; font-size: 12px; }
  #card .it .ago { color: var(--muted); font-size: 11px; white-space: nowrap; }
  #card .it.wrap .tx { white-space: normal; }
  #card .more { color: var(--muted); font-size: 12px; padding: 2px 6px; }
</style>
</head>
<body>
<div id="app">
  <div id="mapWrap">
    <canvas id="cv"></canvas>
    <div id="toasts"></div>
    <div id="zoomBtns">
      <button class="ghost" id="zin" title="Zoom in">+</button>
      <button class="ghost" id="zout" title="Zoom out">&minus;</button>
      <button class="ghost" id="zfit" title="Show whole map">&#9635;</button>
    </div>
    <div id="msg">Fill in the server details on the right and press Connect.</div>
    <div id="hover"></div>
    <div id="heatKey"></div>
    <div id="card"></div>
  </div>

  <aside id="side">
    <header>
      <div class="titleRow">
        <h1>Rust Live Map</h1>
        <button class="ghost small" id="discBtn">Disconnect</button>
      </div>
      <div class="status"><span class="dot" id="stDot"></span><span id="stText">Not connected</span></div>
      <div id="health">
        <div class="stat" id="hFps"><b>-</b><span>FPS</span></div>
        <div class="stat" id="hEnt"><b>-</b><span>entities</span></div>
        <div class="stat" id="hMem"><b>-</b><span>memory</span></div>
        <div class="stat" id="hUp"><b>-</b><span>uptime</span></div>
      </div>
    </header>

    <section id="connBox">
      <div class="row">
        <div><label for="host">Server address</label><input type="text" id="host" value="127.0.0.1"></div>
        <div class="port"><label for="port">RCON port</label><input type="number" id="port" value="28016"></div>
      </div>
      <label for="pw">RCON password</label>
      <input type="password" id="pw" autocomplete="off">
      <label class="check"><input type="checkbox" id="remember"> Remember on this computer</label>
      <button id="connectBtn">Connect</button>
    </section>

    <section>
      <div class="toggles">
        <label class="check"><input type="checkbox" id="tGrid" checked> Grid</label>
        <label class="check"><input type="checkbox" id="tMon" checked> Monuments</label>
        <label class="check"><input type="checkbox" id="tSleep" checked> Sleepers</label>
        <label class="check"><input type="checkbox" id="tNames" checked> Names</label>
        <label class="check"><input type="checkbox" id="tTrails" checked> Trails
          <select id="trailLen" title="How far back trails go">
            <option value="10">10 min</option><option value="30" selected>30 min</option><option value="60">60 min</option>
          </select></label>
        <label class="check"><input type="checkbox" id="tDeaths" checked> Deaths</label>
        <label class="check"><input type="checkbox" id="tBases" checked> Bases</label>
        <label class="check" title="Patrol helicopter, Chinook, cargo ship, Bradley, airdrops, locked crates, travelling vendor, Deep Sea"><input type="checkbox" id="tGame" checked> Game events</label>
        <label class="check"><input type="checkbox" id="tSound" checked> Sounds</label>
      </div>
      <div class="heatRow">
        <label class="check"><input type="checkbox" id="tHeat"> Heatmap</label>
        <select id="heatLayer" title="What the heatmap shows">
          <option value="activity">Activity</option><option value="deaths">All deaths</option><option value="pvp">PvP kills</option>
        </select>
        <select id="heatPeriod" title="Which time the heatmap covers">
          <option value="hour">Last hour</option><option value="day" selected>Last 24 hours</option><option value="wipe">Since wipe</option>
        </select>
      </div>
      <div id="busyNote"></div>
    </section>

    <div class="tabs">
      <div class="tab on" data-pane="players">Players</div>
      <div class="tab" data-pane="chat">Chat<span class="badge" id="chatBadge"></span></div>
      <div class="tab" data-pane="events">Events<span class="badge" id="evBadge"></span></div>
    </div>
    <div class="pane on" id="pane-players">
      <input type="text" id="search" placeholder="Find a player (name or Steam ID)" autocomplete="off">
      <div id="listNote"></div>
      <div id="listBox"><div class="empty">No data yet.</div></div>
    </div>
    <div class="pane" id="pane-chat"><div class="empty">No chat yet.</div></div>
    <div class="pane" id="pane-events"><div class="empty">Joins, leaves and deaths show up here.</div></div>
    <form id="chatForm" autocomplete="off">
      <input type="text" id="chatInput" maxlength="250" placeholder="Message to everyone (as SERVER)">
      <button type="submit">Send</button>
    </form>
    <footer id="foot">&nbsp;</footer>
  </aside>
</div>

<script>
(() => {
  'use strict';
  const POLL_MS = 2000, INFO_MS = 5000, BASES_MS = 60000, BASES_SCAN_MS = 5000;
  const SLEEPERS_MIN_MS = 60000;   // ask for sleepers at most once a minute (only when they changed)
  const STATIC_REFRESH_MS = 30000; // redraw fading deaths and trails at least this often
  const QUIET_ABOVE = 30;          // more players online: no pop-ups or sounds for joins, leaves, deaths and chat
  const ALL_TRAILS_MAX = 50;       // more players online: only the selected player's trail
  const NAMES_ZOOM_ABOVE = 60;     // more players online: names only when zoomed in
  const MANY_MARKERS = 1500;       // more sleepers or bases: small squares when zoomed out
  const LIST_MAX = 100;            // player list rows shown at once
  const GRID_CELL = 1024 / 7;
  const ID = { map: 7001, players: 7002, trails: 7003, bases: 7004, info: 7005, chatTail: 7006, say: 7007,
    sleepers: 7008, deaths: 7009, trail: 7010, heat: 7011 };
  const HEAT_MS = 60000;            // the server shares a heatmap answer for a minute
  const TEAM_COLORS = ['#4fc3f7', '#f06292', '#aed581', '#ffb74d', '#ba68c8', '#4db6ac', '#fff176', '#90a4ae', '#ff8a65', '#7986cb'];
  const DEATH_SHOW_SECONDS = 60 * 60;
  const TOGGLES = ['tGrid', 'tMon', 'tSleep', 'tNames', 'tTrails', 'tDeaths', 'tBases', 'tSound', 'tHeat', 'tGame'];

  const $ = id => document.getElementById(id);
  const cv = $('cv'), ctx = cv.getContext('2d'), wrap = $('mapWrap');
  // Everything that rarely changes (map, grid, bases, sleepers, deaths, trails) is drawn on a hidden layer,
  // so each animation frame only copies that layer and draws the online players on top.
  const layer = document.createElement('canvas'), lctx = layer.getContext('2d');
  let g = ctx; // the canvas being drawn on right now
  const collator = new Intl.Collator(undefined, { sensitivity: 'base' });

  // ---------- state ----------
  let ws = null, wantConnected = false, timers = [], retryTimer = null, basesTimer = null;
  let mapInfo = null, mapImg = null, worldSize = 0;
  let online = new Map();           // id -> {data, fromX, fromZ, toX, toZ, t0}
  let sleepers = new Map();         // id -> data
  let sleepersSorted = null;        // cached sorted list for the player list
  let teamLeaders = {};             // teamId -> leader steamId
  let sleepersVersion = -1, sleepersAskedAt = 0, sleepersPending = false, sleeperCount = 0;
  let lastData = null, lastUpdate = 0, firstPlayers = true, quiet = false;
  let serverOffset = 0;             // server unix seconds - local unix seconds
  let trails = new Map();           // id -> [[t,x,z], ...]
  let trailKeepSec = 3600, trailStep = 1, fullTrails = new Set();
  let deaths = [], lastDeath = 0, deathsPending = false, deathsLoaded = false;
  let bases = [], basesByOwner = new Map(), basesComplete = true, basesProgress = '';
  let gameEvents = new Map(), seenNews = new Set(); // id -> {data, fromX, fromZ, toX, toZ, t0, got}
  let heat = null, heatCanvas = null; // last heatmap answer, and its picture (one pixel per square)
  let chat = [], events = [];
  let activePane = 'players', unread = { chat: 0, events: 0 };
  let selected = null, follow = false;
  let view = { s: 0.3, ox: 0, oy: 0 }; // screen = img * s + o
  let W = 0, H = 0, dpr = 1;
  let dirty = true, staticDirty = true, listDirty = true, chatDirty = false, eventsDirty = false, cardDirty = false;

  // ---------- saved settings (stay in this browser only) ----------
  try {
    const saved = JSON.parse(localStorage.getItem('rustLiveMap') || '{}');
    if (saved.host) $('host').value = saved.host;
    if (saved.port) $('port').value = saved.port;
    if (saved.pw) { $('pw').value = saved.pw; $('remember').checked = true; }
    if (saved.trailLen) $('trailLen').value = saved.trailLen;
    if (saved.heatLayer) $('heatLayer').value = saved.heatLayer;
    if (saved.heatPeriod) $('heatPeriod').value = saved.heatPeriod;
    for (const k of TOGGLES) if (k in saved) $(k).checked = saved[k];
  } catch (e) {}
  function saveSettings() {
    const s = { host: $('host').value.trim(), port: $('port').value, trailLen: $('trailLen').value, heatLayer: $('heatLayer').value, heatPeriod: $('heatPeriod').value };
    if ($('remember').checked) s.pw = $('pw').value;
    for (const k of TOGGLES) s[k] = $(k).checked;
    localStorage.setItem('rustLiveMap', JSON.stringify(s));
  }

  // ---------- connection ----------
  function setStatus(kind, text) { $('stDot').className = 'dot ' + kind; $('stText').textContent = text; }
  function showMsg(t) { $('msg').textContent = t || ''; }
  function stopTimers() { timers.forEach(clearInterval); timers = []; clearTimeout(basesTimer); basesTimer = null; }

  function connect() {
    const host = $('host').value.trim(), port = $('port').value.trim(), pw = $('pw').value;
    if (!host || !port || !pw) { showMsg('Please fill in address, port and password.'); return; }
    saveSettings();
    wantConnected = true;
    clearTimeout(retryTimer);
    if (ws) { ws.onclose = null; ws.close(); }
    setStatus('wait', 'Connecting...');
    let opened = false;
    try { ws = new WebSocket('ws://' + host + ':' + port + '/' + encodeURIComponent(pw)); }
    catch (e) { setStatus('bad', 'Bad address'); return; }

    ws.onopen = () => {
      opened = true;
      setStatus('ok', 'Connected to ' + host);
      $('connBox').style.display = 'none';
      $('discBtn').style.display = 'block';
      showMsg(mapImg ? '' : 'Loading map image...');
      // after a reconnect: ask for everything again, but don't announce everyone as joined
      firstPlayers = true; sleepersVersion = -1; sleepersPending = false; deathsPending = false;
      fullTrails.clear();
      if (!mapImg) send('livemap.mapdata', ID.map);
      send('livemap.trails', ID.trails);
      send('chat.tail 50', ID.chatTail);
      const poll = () => send('livemap.players', ID.players);
      const info = () => send('serverinfo', ID.info);
      poll(); info(); askBases(); askHeat();
      stopTimers();
      timers.push(setInterval(poll, POLL_MS), setInterval(info, INFO_MS), setInterval(askBases, BASES_MS), setInterval(askHeat, HEAT_MS));
    };
    ws.onmessage = ev => {
      let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
      if (m.Type === 'Chat') { try { addChat(JSON.parse(m.Message), true); } catch (e) {} return; }
      const txt = (m.Message || '').trim();
      if (m.Identifier === ID.players && /not found|unknown command/i.test(txt)) {
        showMsg('Connected, but the Admin Live Map plugin (AdminLiveMap.cs) is not answering. Is it installed and loaded on the server?');
        return;
      }
      if (!txt.startsWith('{') && !txt.startsWith('[')) return; // other text, e.g. "Rendering map image..."
      let d; try { d = JSON.parse(txt); } catch (e) { return; }
      switch (m.Identifier) {
        case ID.map: if (d.type === 'map') loadMap(d); else if (d.type === 'error') showMsg(d.message); break;
        case ID.players: if (d.type === 'players') updatePlayers(d); break;
        case ID.sleepers: if (d.type === 'sleepers') loadSleepers(d); break;
        case ID.deaths: if (d.type === 'deaths') loadDeaths(d); break;
        case ID.trails: case ID.trail: if (d.type === 'trails' || d.type === 'trail') loadTrails(d); break;
        case ID.bases: if (d.type === 'bases') loadBases(d); break;
        case ID.heat: if (d.type === 'heat') loadHeat(d); break;
        case ID.info: updateHealth(d); break;
        case ID.chatTail: if (Array.isArray(d)) { chat = []; d.forEach(c => addChat(c, false)); chatDirty = true; } break;
      }
    };
    ws.onclose = () => {
      stopTimers();
      if (!wantConnected) { setStatus('', 'Not connected'); return; }
      if (!opened) {
        wantConnected = false;
        showConnBox();
        setStatus('bad', 'Could not connect');
        showMsg('Could not connect. Check that the server is running and that the address, port and RCON password are right.');
        return;
      }
      setStatus('wait', 'Connection lost, retrying...');
      retryTimer = setTimeout(connect, 5000);
    };
  }
  function showConnBox() { $('connBox').style.display = ''; $('discBtn').style.display = 'none'; }
  function disconnect() {
    wantConnected = false;
    stopTimers(); clearTimeout(retryTimer);
    if (ws) ws.close();
    showConnBox();
    $('health').classList.remove('on');
  }
  function send(cmd, id) {
    if (ws && ws.readyState === 1) ws.send(JSON.stringify({ Identifier: id, Message: cmd, Name: 'LiveMap' }));
  }
  function askBases() { if ($('tBases').checked) send('livemap.bases', ID.bases); }
  function askHeat() { if ($('tHeat').checked) send('livemap.heat ' + $('heatLayer').value + ' ' + $('heatPeriod').value, ID.heat); }
  $('connectBtn').onclick = connect;
  $('discBtn').onclick = disconnect;
  $('pw').addEventListener('keydown', e => { if (e.key === 'Enter') connect(); });
  $('remember').onchange = saveSettings;

  // ---------- map ----------
  function loadMap(d) {
    const img = new Image();

  function w2i(x, z) {
    const inner = mapImg.naturalWidth - 2 * mapInfo.margin;

    return [mapInfo.margin + (x + half) * k, mapInfo.margin + (half - z) * k];
  }
  function i2s(px, py) { return [px * view.s + view.ox, py * view.s + view.oy]; }
  function w2s(x, z) { const p = w2i(x, z); return i2s(p[0], p[1]); }
  function metersToPx(m) { return m * (mapImg.naturalWidth - 2 * mapInfo.margin) / mapInfo.size * view.s; }
  function onScreen(p, pad) { return p[0] > -pad && p[1] > -pad && p[0] < W + pad && p[1] < H + pad; }

  function resize() {
    const r = wrap.getBoundingClientRect();

    cv.width = layer.width = Math.round(W * dpr); cv.height = layer.height = Math.round(H * dpr);
    viewChanged();
  }
  function fit() {
    if (!mapImg) return;
    const s = Math.min(W, H) / mapImg.naturalWidth * 0.98;
    view.s = s;
    view.ox = (W - mapImg.naturalWidth * s) / 2;
    view.oy = (H - mapImg.naturalHeight * s) / 2;
    viewChanged();
  }
  function zoomAt(f, sx, sy) {
    const ns = Math.max(0.05, Math.min(6, view.s * f));
    f = ns / view.s;
    view.ox = sx - (sx - view.ox) * f;
    view.oy = sy - (sy - view.oy) * f;
    view.s = ns;
    viewChanged();
  }

  // ---------- helpers ----------

  // ---------- sounds ----------
  let audio = null;

    if (!$('tSound').checked) return;

      const notes = { join: [523, 784], leave: [523, 392], death: [196, 147], chat: [880], game: [392, 523, 659] }[kind] || [660];
      let t = audio.currentTime;
      for (const f of notes) {
        const o = audio.createOscillator(), gn = audio.createGain();
        o.frequency.value = f; o.type = kind === 'death' ? 'triangle' : 'sine';
        gn.gain.setValueAtTime(0.0001, t); gn.gain.exponentialRampToValueAtTime(0.15, t + 0.02);
        gn.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
        o.connect(gn).connect(audio.destination); o.start(t); o.stop(t + 0.2);
        t += 0.13;
      }
    } catch (e) {}
  }

  // ---------- toasts & events ----------
  function toast(kind, text) {
    const el = document.createElement('div');

    setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 600); }, 6000);
  }
  // isNew: it happened while the page was open. On busy servers it is listed without a pop-up or sound.
  function addEvent(kind, text, time, pos, isNew, icon) {
    const e = { kind, text, time, pos, icon };
    let i = events.length;
    while (i > 0 && events[i - 1].time > time) i--;
    events.splice(i, 0, e);
    if (events.length > 300) events.shift();
    // Game events are always kept, but stay out of sight (no line, pop-up or sound) while "Game events" is unticked.
    if (isNew && !(kind === 'game' && !$('tGame').checked)) {
      if (!quiet || kind === 'game') { toast(kind, text); beep(kind); }
      if (activePane !== 'events') unread.events++;
    }
    eventsDirty = true;
  }
  function renderEvents() {
    eventsDirty = false;
    $('evBadge').textContent = unread.events || '';
    if (activePane !== 'events') return;
    const box = $('pane-events');
    const showGame = $('tGame').checked;
    const shown = showGame ? events : events.filter(e => e.kind !== 'game');
    if (!shown.length) { box.innerHTML = '<div class="empty">Joins, leaves and deaths show up here.</div>'; return; }
    const stick = box.scrollTop + box.clientHeight >= box.scrollHeight - 30;
    box.innerHTML = '';
    const icons = { join: '▶', leave: '◀', death: '☠' };
    const frag = document.createDocumentFragment();
    for (const e of shown) {
      const el = document.createElement('div');

      el.querySelector('.ic').textContent = e.icon || icons[e.kind] || '•';
      el.querySelector('.tx').textContent = e.text;

    if (stick) box.scrollTop = box.scrollHeight;
  }

  // ---------- chat ----------
  const CHANNELS = { 1: 'Team', 3: 'Cards', 4: 'Local', 5: 'Clan' };
  function addChat(c, live) {
    if (!c || typeof c.Message !== 'string') return;
    chat.push({ time: c.Time, name: c.Username, msg: c.Message, channel: c.Channel, color: c.Color, server: c.Channel === 2 || c.UserId === '0' });
    if (chat.length > 300) chat.shift();
    if (live && activePane !== 'chat') {
      unread.chat++;

  // ---------- players ----------
  function updatePlayers(d) {
    if (!Array.isArray(d.online)) {
      showMsg('The Admin Live Map plugin on the server is older than this page. Please update AdminLiveMap.cs to version 1.1.0 or newer.');
      return;
    }
    if (typeof d.now === 'number') serverOffset = d.now - Date.now() / 1000;
    worldSize = d.size;
    Object.assign(teamLeaders, d.teams || {});
    quiet = d.online.length > QUIET_ABOVE;
    const now = performance.now(), seen = new Set();
    for (const r of d.online) {
      // [steamId, name, x, z, heading, health, flags, teamId, vehicle, seconds connected]
      const p = { id: r[0], name: r[1], x: r[2], z: r[3], heading: r[4], health: r[5], flags: r[6], team: r[7], mounted: r[8],
        connected: typeof r[9] === 'number' ? r[9] : null };
      if (seen.has(p.id)) continue;
      seen.add(p.id);
      p.status = p.flags & 2 ? 'dead' : 'online';
      p.asleep = !!(p.flags & 1); // connected, but hasn't woken up yet
      const old = online.get(p.id);
      if (old) {
        const cur = currentPos(old, now);
        const jump = Math.hypot(p.x - cur[0], p.z - cur[1]) > 300; // teleport / respawn: don't slide
        Object.assign(old, { data: p, fromX: jump ? p.x : cur[0], fromZ: jump ? p.z : cur[1], toX: p.x, toZ: p.z, t0: now });
      } else {
        online.set(p.id, { data: p, fromX: p.x, fromZ: p.z, toX: p.x, toZ: p.z, t0: now });
        if (!firstPlayers) addEvent('join', p.name + ' joined', d.now, [p.x, p.z], true);
        if (sleepers.delete(p.id)) { sleepersSorted = null; staticDirty = true; }
      }
      if (p.status === 'online') addTrailPoint(p.id, d.now, p.x, p.z);
    }
    for (const [id, e] of online) {
      if (seen.has(id)) continue;
      online.delete(id);
      if (!firstPlayers) addEvent('leave', e.data.name + ' left', d.now, [e.toX, e.toZ], true);
      // they now sleep where they were; the next sleepers update confirms it
      sleepers.set(id, Object.assign({}, e.data, { x: e.toX, z: e.toZ, status: 'sleeping', heading: -1, mounted: null, asleep: false, connected: null }));
      sleepersSorted = null;
      staticDirty = true;
    }

    sleeperCount = d.sleeperCount || 0;
    const due = sleepersVersion < 0 || Date.now() - sleepersAskedAt > SLEEPERS_MIN_MS;
    if (!sleepersPending && d.sleepersVersion !== sleepersVersion && due) {
      sleepersPending = true; sleepersAskedAt = Date.now();
      send('livemap.sleepers', ID.sleepers);
    }
    if (d.lastDeath < lastDeath) { lastDeath = 0; deaths = []; staticDirty = true; } // the server's death list was reset
    if (d.lastDeath > lastDeath && !deathsPending) { deathsPending = true; send('livemap.deaths ' + lastDeath, ID.deaths); }
    updateGameEvents(d, now);

    firstPlayers = false;
    lastData = d; lastUpdate = Date.now();
    listDirty = true; cardDirty = true;
    if ($('tTrails').checked) staticDirty = true; // trails grew
    dirty = true;
    updateBusyNote();
  }
  function loadSleepers(d) {
    sleepersPending = false;
    sleepersVersion = d.version;
    sleepers = new Map();
    Object.assign(teamLeaders, d.teams || {});
    for (const r of d.sleepers) {
      // [steamId, name, x, z, health, flags, teamId]
      if (online.has(r[0])) continue;
      sleepers.set(r[0], { id: r[0], name: r[1], x: r[2], z: r[3], health: r[4], flags: r[5], team: r[6], status: 'sleeping', heading: -1 });
    }
    sleepersSorted = null; listDirty = true; staticDirty = true; cardDirty = true;
  }
  function loadDeaths(d) {
    deathsPending = false;
    for (const x of d.deaths) {
      if (x.id <= lastDeath) continue;
      deaths.push(x);
      addEvent('death', deathText(x), x.time, [x.x, x.z], deathsLoaded);
    }
    lastDeath = Math.max(lastDeath, d.lastDeath);
    deathsLoaded = true;
    const cutoff = serverNow() - DEATH_SHOW_SECONDS;
    deaths = deaths.filter(x => x.time >= cutoff);
    staticDirty = true; cardDirty = true;
  }
  const DAMAGE_WORDS = { fall: 'fell to their death', bleeding: 'bled out', hunger: 'starved', thirst: 'died of thirst',
    cold: 'froze to death', heat: 'burned to death', drowned: 'drowned', radiationexposure: 'died of radiation',
    radiation: 'died of radiation', poison: 'was poisoned', suicide: 'killed themselves', generic: 'died', collision: 'was run over' };
  function deathText(x) {
    let s;
    if (x.killer === 'themselves') s = x.victim + ' killed themselves';
    else if (!x.killerId && DAMAGE_WORDS[x.killer]) s = x.victim + ' ' + DAMAGE_WORDS[x.killer];
    else s = x.victim + ' was killed by ' + (x.killerId ? x.killer : friendlyKiller(x.killer));
    const extra = [];
    if (x.weapon) extra.push(x.weapon);
    if (x.distance > 1) extra.push(x.distance + ' m');
    if (extra.length) s += ' (' + extra.join(', ') + ')';
    return s + ' in ' + x.grid;
  }
  // turn game object names into words, e.g. "scientistnpc roam" -> "a scientist"
  const KILLERS = [
    [/scarecrow|zombie/, 'a scarecrow'], [/scientist|npc|tunneldweller|underwaterdweller|bandit|guard/, 'a scientist'], [/patrolhelicopter|heli/, 'the patrol helicopter'],
    [/bradley/, 'the Bradley tank'], [/autoturret/, 'an auto turret'], [/flameturret/, 'a flame turret'],
    [/guntrap/, 'a shotgun trap'], [/samsite/, 'a SAM site'], [/landmine/, 'a landmine'], [/beartrap/, 'a bear trap'],
    [/wolf/, 'a wolf'], [/bear/, 'a bear'], [/boar/, 'a boar'], [/stag/, 'a stag'], [/chicken/, 'a chicken'],
    [/shark/, 'a shark'], [/crocodile/, 'a crocodile'], [/tiger/, 'a tiger'], [/panther/, 'a panther'], [/snake/, 'a snake'],
    [/barricade|spikes/, 'a barricade'], [/campfire|fireplace|furnace/, 'a fire'], [/cargoship/, 'the cargo ship'],
    [/train|workcart/, 'a train'], [/minicopter|scraptransport|attackhelicopter|car|horse|boat|rhib|sub/, 'a vehicle']
  ];
  function friendlyKiller(k) {

  function currentPos(e, now) {
    const t = Math.min(1, (now - e.t0) / POLL_MS);

  function visible(p) { return p.status !== 'sleeping' || $('tSleep').checked; }
  function updateBusyNote() {
    const parts = [];
    if (quiet) parts.push('no pop-ups or sounds for joins, leaves, deaths and chat (they are still listed under Events)');
    if (online.size > ALL_TRAILS_MAX) parts.push('trails only for the player you select');
    if (online.size > NAMES_ZOOM_ABOVE) parts.push('names show when you zoom in');
    const t = parts.length ? 'Busy server: ' + parts.join('; ') + '.' : '';
    if ($('busyNote').textContent !== t) $('busyNote').textContent = t;
  }

  // ---------- trails ----------
  function loadTrails(d) {
    if (typeof d.now === 'number') serverOffset = d.now - Date.now() / 1000;
    if (d.type === 'trail') { mergeTrail(d.id, d.trail); fullTrails.add(d.id); staticDirty = true; return; }
    trailKeepSec = (d.minutes || 60) * 60;
    trailStep = d.step || 1;
    for (const id in d.trails) mergeTrail(id, d.trails[id]);
    if (trailStep === 1) for (const id in d.trails) fullTrails.add(id);
    if (selected) askFullTrail(selected);
    staticDirty = true;
  }
  function mergeTrail(id, flat) {
    // the server sends [time, x, z, time, x, z, ...]; points collected by this page since then are kept
    const server = [];
    for (let i = 0; i + 2 < flat.length; i += 3) server.push([flat[i], flat[i + 1], flat[i + 2]]);
    const mine = trails.get(id) || [];
    const lastT = server.length ? server[server.length - 1][0] : 0;
    trails.set(id, server.concat(mine.filter(p => p[0] > lastT)));
  }
  function addTrailPoint(id, t, x, z) {
    let tr = trails.get(id);
    if (!tr) trails.set(id, tr = []);
    const last = tr[tr.length - 1];
    if (last && Math.hypot(x - last[1], z - last[2]) < 3) return;
    tr.push([t, x, z]);
    const cutoff = t - trailKeepSec;
    let old = 0;
    while (old < tr.length && tr[old][0] < cutoff) old++;
    if (old) tr.splice(0, old);
  }
  function askFullTrail(id) {
    // when the server thinned out trails, get the selected player's trail in full
    if (trailStep > 1 && !fullTrails.has(id)) send('livemap.trails ' + id, ID.trail);
  }
  function trailIds() {
    if (online.size <= ALL_TRAILS_MAX) return trails.keys();
    return selected && trails.has(selected) ? [selected] : [];
  }

  // ---------- bases ----------
  function loadBases(d) {
    const names = d.names || {};
    bases = [];
    basesByOwner = new Map();
    for (const r of d.bases) {
      // [cupboardId, x, z, ownerId, teamId, blocks, extraCupboard, minX, maxX, minZ, maxZ, [authorised]]
      const b = { id: r[0], x: r[1], z: r[2], ownerId: r[3], team: r[4], blocks: r[5], extraTc: !!r[6],
        minX: r[7], maxX: r[8], minZ: r[9], maxZ: r[10], auth: r[11] || [] };
      b.playerOwned = !!b.ownerId && isSteamId(b.ownerId);
      b.owner = b.ownerId ? names[b.ownerId] || b.ownerId : null;
      b.authNames = b.auth.filter(isSteamId).map(a => names[a] || a);
      b.color = b.playerOwned ? colorFor(b.team, b.ownerId) : '#9aa0a6';
      bases.push(b);
      if (b.playerOwned && !b.extraTc) basesByOwner.set(b.ownerId, (basesByOwner.get(b.ownerId) || 0) + 1);
    }
    basesComplete = d.complete !== false;
    basesProgress = basesComplete || !d.total ? '' : 'measuring bases ' + Math.floor(100 * d.measured / d.total) + '%';
    clearTimeout(basesTimer); basesTimer = null;
    if (!basesComplete) basesTimer = setTimeout(askBases, BASES_SCAN_MS); // sizes still being measured
    listDirty = true; staticDirty = true; cardDirty = true;
  }

  // ---------- game events ----------
  const GAME = {
    heli: { name: 'Patrol helicopter', icon: '🚁', ring: '#e0634f', moving: true },
    ch47: { name: 'Chinook', icon: '🚁', ring: '#d9a441', moving: true, note: 'drops a locked crate' },
    cargo: { name: 'Cargo ship', icon: '🚢', ring: '#4fc3f7', moving: true },
    bradley: { name: 'Bradley', icon: '', ring: '#e0634f', moving: true },
    plane: { name: 'Cargo plane', icon: '✈', ring: '#aed581', moving: true, note: 'airdrop on the way' },
    drop: { name: 'Supply drop', icon: '🪂', ring: '#aed581' },
    crate: { name: 'Locked crate', icon: '🔒', ring: '#ffb74d' },
    vendor: { name: 'Travelling vendor', icon: '🛒', ring: '#ba68c8', moving: true },
    ghostship: { name: 'Ghost ship', icon: '👻', ring: '#90a4ae', moving: true, note: 'Deep Sea' },
    island: { name: 'Deep Sea island', icon: '🏝', ring: '#4db6ac' },
    city: { name: 'Floating city', icon: '🏙', ring: '#7986cb', note: 'Deep Sea' }
  };
  const ANNOUNCE = { heli: 'arrived', ch47: 'is flying in', cargo: 'arrived', plane: 'is on its way', drop: 'is coming down',
    vendor: 'arrived', ghostship: 'appeared' };
  const LEAVES = { heli: 'left', ch47: 'left', cargo: 'left the map', vendor: 'left', ghostship: 'is gone' };
  function placeName(x, z) {
    // "at Launch Site (K10)" when a monument is close, otherwise "in K10"
    let best = null, bestD = 400;
    for (const m of (mapInfo && mapInfo.monuments) || []) {
      const dd = Math.hypot(m.x - x, m.z - z);
      if (dd < bestD) { bestD = dd; best = m.name; }
    }
    const grid = gridOf(x, z);
    return best ? 'at ' + best + (grid ? ' (' + grid + ')' : '') : grid ? 'in ' + grid : 'out at sea';

    }
    if ($('tBases').checked) {
      const pad = 6 / near; // a few pixels of slack around small bases
      for (const b of bases) {
        if (b.extraTc) continue;
        if (wx < b.minX - pad || wx > b.maxX + pad || wz < b.minZ - pad || wz > b.maxZ + pad) continue;
        line((b.playerOwned ? 'Base of ' + (b.owner || '?') : 'Unowned / event base') + ' · ' +
          (b.blocks < 0 ? 'size not measured yet' : b.blocks + ' building blocks') +
          (b.authNames.length ? ' · cupboard access: ' + b.authNames.join(', ') : ''));
      }
    }
    h.style.left = Math.min(sx + 14, r.width - 330) + 'px'; h.style.top = (sy + 14) + 'px'; h.style.display = 'block';
  }

  // For measuring the page on big servers: LiveMapDebug.drawNow() in the browser console
  window.LiveMapDebug = {
    drawNow() { staticDirty = true; const t = performance.now(); draw(performance.now()); return { totalMs: performance.now() - t, backgroundMs: lastStaticMs, playersMs: lastPlayersMs }; },
    frameMs() { const t = performance.now(); draw(performance.now()); return { frameMs: performance.now() - t, playersMs: lastPlayersMs }; },
    counts() { return { online: online.size, sleepers: sleepers.size, bases: bases.length, trails: trails.size, deaths: deaths.length, events: events.length }; },
    renderListMs() { const t = performance.now(); renderList(); return performance.now() - t; }
  };

  // Browsers block an https:// page from opening the plain ws:// connection that Rust's WebRCON uses.
  if (location.protocol === 'https:') {
    showMsg('This page must be opened from your own computer, not from a website. Download LiveMap.html, then double-click the file to open it.');
    $('connectBtn').disabled = true;
    return;
  }

  // connect straight away if the password was remembered
  if ($('pw').value) connect();
})();
</script>
</body>
</html>
